# GROUND TRUTH: class 5 — OIDC wildcard `sub` misconfiguration, ANALYTICAL ONLY
#
# What this workflow does (and does not do):
#   This workflow runs GitHub's own official OIDC debugging action,
#   `github/actions-oidc-debugger`. That action requests a real OpenID
#   Connect JSON Web Token from GitHub's OIDC provider and prints its claims
#   (`sub`, `aud`, `repository`, `ref`, etc.) to the job log. No cloud
#   provider (AWS, Azure, GCP) is contacted at any point. No cloud account
#   exists for this project and none is created.
#   (https://docs.github.com/en/actions/reference/openid-connect-reference)
#
#   The vulnerability this class is about does NOT live in this YAML file at
#   all -- it lives in a cloud-side IAM trust policy (e.g. an AWS IAM role's
#   trust relationship) that uses a wildcard match on the `sub` claim, such
#   as `repo:someorg/*:*`, instead of pinning it to an exact repository and
#   ref. That trust policy is analyzed separately, statically, in
#   docs/oidc-trust-policy-analysis.md, using the real claims this workflow
#   captures. This workflow's only job is to produce a real `sub` value to
#   analyze against; it never assumes any cloud role.
#
# Safety boundaries:
#   - `id-token: write` is required for any workflow to request an OIDC
#     token at all; it is scoped to this job only.
#   - No `aws-actions/configure-aws-credentials` or any cloud-provider auth
#     action appears anywhere in this repository.
#   - Any real token value in captured output is redacted before being
#     committed as evidence (see evidence/README.md and
#     docs/oidc-trust-policy-analysis.md for the redaction policy).

name: oidc-debug (ANALYTICAL ONLY - class 5)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  mint-and-print-oidc-claims:
    runs-on: ubuntu-latest
    steps:
      # Requests a real OIDC token from GitHub's own provider using the
      # runtime environment variables GitHub injects when `id-token: write`
      # is granted, then decodes and prints ONLY the claim set.
      #
      # This replaced `github/actions-oidc-debugger@main`, which no longer
      # builds: its Dockerfile pins an exact Alpine Go package version
      # (`apk add go=$(cat .go-version)-r0`) that Alpine no longer carries,
      # so its image build fails with exit code 2 before the action runs.
      # That is an upstream breakage in GitHub's own sample action, not a
      # problem with this workflow. Calling the endpoint directly removes
      # the dependency and does exactly what the action did.
      - name: Mint OIDC token and print its claims
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/wmshearer" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')

          # A JWT is three dot-separated base64url parts: header.payload.signature.
          # Only the payload (the claims) is decoded and printed. The signature
          # is never printed, so nothing in the log can be replayed as a
          # credential.
          echo "$TOKEN" | cut -d. -f2 | python3 -c '
          import sys, base64, json
          raw = sys.stdin.read().strip()
          raw += "=" * (-len(raw) % 4)
          claims = json.loads(base64.urlsafe_b64decode(raw))
          print(json.dumps(claims, indent=2, sort_keys=True))
          '
